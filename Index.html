<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Xin lỗi cậu 🩷</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap');

  :root{
    --cream: #fff6ee;
    --blush: #ffd9e3;
    --coral: #ff6f91;
    --plum: #4a2545;
    --lavender: #b98ee0;
    --gold: #ffb84d;
  }

  *{ box-sizing:border-box; }

  html, body{
    margin:0; padding:0;
    width:100%;
    height:100vh;
    height:100dvh;
    overflow:hidden;
    overscroll-behavior:none;
    touch-action: manipulation;
    -webkit-text-size-adjust:100%;
    background:
      radial-gradient(circle at 15% 20%, #ffe3ea 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, #e9d6ff 0%, transparent 50%),
      linear-gradient(160deg, var(--cream) 0%, var(--blush) 100%);
    font-family: 'Quicksand', sans-serif;
    color: var(--plum);
  }

  body{
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  .sky{
    position:fixed; inset:0; overflow:hidden; pointer-events:none;
  }
  .petal{
    position:absolute; top:-40px; font-size:22px; opacity:.7;
    animation: fall linear infinite;
  }
  @keyframes fall{
    to{ transform: translateY(110vh) rotate(360deg); }
  }

  .stage{
    position:relative;
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
  }

  .card{
    position:relative;
    width:min(480px, 88vw);
    background: #fffaf5;
    border-radius: 28px;
    padding: 44px 36px 40px;
    text-align:center;
    box-shadow: 0 30px 60px -20px rgba(74,37,69,0.35), 0 0 0 1px rgba(255,255,255,0.6) inset;
    border: 2px solid #ffffff;
  }

  .card::before{
    content:"";
    position:absolute; inset:-2px;
    border-radius:30px;
    padding:2px;
    background: linear-gradient(135deg, var(--coral), var(--lavender), var(--gold));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity:.55;
    pointer-events:none;
  }

  .heart{
    font-size: 46px;
    display:inline-block;
    animation: beat 1.4s ease-in-out infinite;
    filter: drop-shadow(0 6px 10px rgba(255,111,145,.45));
  }
  @keyframes beat{
    0%,100%{ transform: scale(1); }
    25%{ transform: scale(1.18); }
    40%{ transform: scale(0.95); }
  }

  h1{
    font-family:'Baloo 2', sans-serif;
    font-size: clamp(24px, 5vw, 32px);
    margin: 14px 0 8px;
    color: var(--coral);
    letter-spacing: 0.2px;
  }

  #msg{
    font-size: 16.5px;
    line-height:1.6;
    color:#6b4460;
    margin: 0 auto 28px;
    max-width: 360px;
    min-height: 78px;
    transition: opacity .18s ease;
  }

  .btn-row{
    position: relative;
    display:flex;
    justify-content:center;
    align-items:center;
    gap: 18px;
    height: 60px;
  }

  button{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    border:none;
    border-radius: 999px;
    cursor:pointer;
    font-size:16px;
    letter-spacing:.2px;
    transition: transform .15s ease, box-shadow .15s ease;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    min-height: 46px;
  }

  #yes{
    padding: 14px 30px;
    background: linear-gradient(135deg, var(--coral), #ff9271);
    color:#fff;
    box-shadow: 0 10px 24px -8px rgba(255,111,145,.65);
    transition: transform .25s cubic-bezier(.34,1.56,.64,1), box-shadow .25s ease, padding .25s ease, font-size .25s ease;
  }
  #yes:hover{ transform: translateY(-2px) scale(1.04); box-shadow: 0 14px 28px -8px rgba(255,111,145,.75); }
  #yes:active{ transform: scale(0.97); }

  #no{
    padding: 14px 22px;
    background: #fff;
    color: var(--plum);
    border: 2px solid #f0d9e6;
    position: relative;
    z-index: 40;
    white-space: nowrap;
  }
  #no:hover{ border-color: var(--lavender); }
  #no.is-fixed{
    transition: left .35s cubic-bezier(.34,1.56,.64,1), top .35s cubic-bezier(.34,1.56,.64,1);
  }

  @media (max-width: 420px){
    .card{ padding: 34px 22px 30px; }
    #msg{ font-size: 15px; max-width: 280px; }
    .btn-row{ gap: 12px; }
    #yes{ padding: 12px 22px; font-size: 15px; }
    #no{ padding: 12px 18px; font-size: 15px; }
  }

  .footnote{
    margin-top: 22px;
    font-size: 12.5px;
    color:#b48fa8;
  }

  #celebrate{
    display:none;
    position:fixed; inset:0;
    align-items:center; justify-content:center;
    background: radial-gradient(circle at center, rgba(255,246,238,.97), rgba(255,217,227,.97));
    text-align:center;
    z-index: 50;
  }
  #celebrate h2{
    font-family:'Baloo 2', sans-serif;
    font-size: clamp(28px, 6vw, 40px);
    color: var(--coral);
    margin-bottom:10px;
  }
  #celebrate p{
    color:#6b4460; font-size:16px; max-width:340px; margin:0 auto;
  }
  .big-heart{
    font-size:70px;
    animation: beat 1s ease-in-out infinite;
    margin-bottom: 6px;
  }

  @media (prefers-reduced-motion: reduce){
    .heart, .big-heart{ animation:none; }
    .petal{ animation:none; display:none; }
  }
</style>
</head>
<body>

<div class="sky" id="sky"></div>

<div class="stage">
  <div class="card">
    <div class="heart">💗</div>
    <h1>Tí Èn ơi, cho anh xin lỗi nha...</h1>
    <p id="msg">Anh biết anh đã sai rồi. Tí Èn tha lỗi cho anh được không? 🥹</p>

    <div class="btn-row">
      <button id="yes" onclick="forgive()">Tha lỗi cho anh 🥺💕</button>
      <button id="no" onclick="dodge()">Hông tha</button>
    </div>

    <div class="footnote">bấm nút bên phải thử coi Tí Èn né được không nè 🐰💨</div>
  </div>
</div>

<div id="celebrate">
  <div>
    <div class="big-heart">🥰</div>
    <h2>Yayyy, cảm ơn Tí Èn nhiều lắm!</h2>
    <p>Anh hứa lần sau sẽ ngoan hơn, không làm Tí Èn buồn nữa đâu. Tí Èn là người dễ thương và bao dung nhất trên đời 💖🐣</p>
  </div>
</div>

<script>
  const messages = [
    "Ơ kìa Tí Èn, đừng như vậy mà 🥺",
    "Thử ấn lại xem, có khi tay Tí Èn bị lỗi đó...",
    "Nút này nó trốn giỏi lắm, đừng phí công 😤",
    "Tí Èn chắc chưa? Suy nghĩ lại đi mà~ 🐰",
    "Anh xin lỗi thật lòng đó nha, tin anh đi 🫶",
    "Được rồi được rồi, anh sẽ mua trà sữa 🧋",
    "Nút 'Hông tha' nó cũng mỏi cánh rồi, tha cho nó đi 🥲",
    "Tí Èn giỏi thật đấy, nhưng mà... tha lỗi đi mà 🙏",
    "Đây là cơ hội cuối để bấm nút bên kia đó nha 😌",
    "Thôi nào, ai mà nỡ giận Tí lâu chứ~ 💗",
    "Nhìn mặt anh dễ thương vậy nè, tha đi mà 🥹",
    "Tí Èn ơi làm ơn đi mà, anh xin đó 🐣"
  ];

  const noTexts = [
    "Hông tha",
    "Hổng chịu đâu 😤",
    "Ứ ừ",
    "Bắt đền cơ",
    "Đừng hòng",
    "Còn lâu à nha",
    "Suy nghĩ tiếp",
    "Chưa đủ ngọt",
    "Thử lại đi",
    "Vẫn là Hông!",
    "Năn nỉ thêm đi",
    "Tí chưa nguôi giận"
  ];

  const noBtn = document.getElementById('no');
  const yesBtn = document.getElementById('yes');
  const msgEl = document.getElementById('msg');
  let clickCount = 0;
  let yesScale = 1;

  function randomPosInViewport(el){
    const w = el.offsetWidth || 100;
    const h = el.offsetHeight || 50;
    const margin = 16;
    const maxX = window.innerWidth - w - margin;
    const maxY = window.innerHeight - h - margin;
    const x = Math.max(margin, Math.random() * maxX);
    const y = Math.max(margin, Math.random() * maxY);
    return {x, y};
  }

  let noIsFixed = false;

  function dodge(){
    clickCount++;

    // Lần bấm đầu tiên: khóa vị trí hiện tại lại rồi mới chuyển sang fixed,
    // để nút không bị nhảy giật về góc màn hình.
    if(!noIsFixed){
      const rect = noBtn.getBoundingClientRect();
      noBtn.style.position = 'fixed';
      noBtn.style.left = rect.left + 'px';
      noBtn.style.top = rect.top + 'px';
      noBtn.style.margin = '0';
      noIsFixed = true;
      // ép trình duyệt tính lại layout trước khi bật hiệu ứng chuyển động
      noBtn.offsetHeight;
      noBtn.classList.add('is-fixed');
    }

    const {x, y} = randomPosInViewport(noBtn);
    noBtn.style.left = x + 'px';
    noBtn.style.top = y + 'px';
    noBtn.style.right = 'auto';
    noBtn.style.bottom = 'auto';

    const text = messages[(clickCount - 1) % messages.length];
    msgEl.style.opacity = 0;
    setTimeout(() => {
      msgEl.textContent = text;
      msgEl.style.opacity = 1;
    }, 150);

    noBtn.textContent = noTexts[(clickCount - 1) % noTexts.length];

    // nút "Tha lỗi" ngày càng to ra
    yesScale = Math.min(yesScale + 0.12, 2.6);
    yesBtn.style.transform = `scale(${yesScale})`;
    yesBtn.style.fontSize = (16 + clickCount) + 'px';
  }

  function forgive(){
    document.getElementById('celebrate').style.display = 'flex';
    burst();
  }

  // cánh hoa rơi nhẹ nhàng nền
  const sky = document.getElementById('sky');
  const petals = ['🌸','💮','🩷','✨','🧸','🐰'];
  for(let i=0;i<18;i++){
    const p = document.createElement('div');
    p.className = 'petal';
    p.textContent = petals[Math.floor(Math.random()*petals.length)];
    p.style.left = Math.random()*100 + 'vw';
    p.style.animationDuration = (6 + Math.random()*6) + 's';
    p.style.animationDelay = (Math.random()*6) + 's';
    p.style.fontSize = (14 + Math.random()*14) + 'px';
    sky.appendChild(p);
  }

  function burst(){
    const emojis = ['🎉','💖','🌟','🩷','✨'];
    for(let i=0;i<26;i++){
      const e = document.createElement('div');
      e.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      e.style.position = 'fixed';
      e.style.left = '50vw';
      e.style.top = '50vh';
      e.style.fontSize = (16 + Math.random()*20) + 'px';
      e.style.zIndex = 60;
      e.style.pointerEvents = 'none';
      document.body.appendChild(e);
      const angle = Math.random()*Math.PI*2;
      const dist = 120 + Math.random()*220;
      const dx = Math.cos(angle)*dist;
      const dy = Math.sin(angle)*dist;
      e.animate([
        { transform: 'translate(0,0) scale(0.6)', opacity: 1 },
        { transform: `translate(${dx}px, ${dy}px) scale(1.1)`, opacity: 0 }
      ], { duration: 900 + Math.random()*500, easing: 'cubic-bezier(.2,.7,.3,1)' });
      setTimeout(()=> e.remove(), 1500);
    }
  }
</script>

</body>
</html>
